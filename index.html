<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1e9;
      --ink: #20211d;
      --muted: #77776f;
      --line: #d9d5ca;
      --accent: #4d5a4b;
      --serif: "Iowan Old Style", "Baskerville", "YuMincho", "Hiragino Mincho ProN", serif;
      --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 0 5.2vw; }
    .topline {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }
    .brand { color: var(--ink); font-size: 12px; letter-spacing: .08em; }
    .hero { padding: clamp(54px, 9vw, 126px) 0 clamp(50px, 7vw, 92px); }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 23px;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: var(--accent); }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(42px, 7.4vw, 94px);
      font-weight: 400;
      letter-spacing: .045em;
      line-height: 1.12;
    }
    .collection-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 15px 0;
      border-top: 1px solid var(--ink);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
    }
    .collection-head strong { color: var(--ink); font-weight: 500; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: clamp(18px, 3.2vw, 46px);
      row-gap: clamp(38px, 6vw, 82px);
      padding: 18px 0 clamp(72px, 10vw, 136px);
    }
    .item { min-width: 0; }
    .image-wrap {
      overflow: hidden;
      background: #e7e3d9;
      aspect-ratio: 1.42 / 1;
    }
    .item:nth-child(3n) .image-wrap { aspect-ratio: 1.12 / 1; }
    .item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 650ms cubic-bezier(.2,.7,.2,1);
    }
    .item:hover img { transform: scale(1.025); }
    .caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 13px;
    }
    .name { margin: 0; font-family: var(--serif); font-size: clamp(16px, 1.7vw, 21px); font-weight: 400; }
    .number { color: var(--muted); font-size: 10px; letter-spacing: .12em; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 12px; }
    .tag {
      display: inline-flex;
      gap: 6px;
      align-items: baseline;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      font-size: 10px;
      line-height: 1.4;
    }
    .tag-label { color: var(--muted); }
    footer {
      display: flex;
      justify-content: space-between;
      padding: 18px 0 26px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .1em;
    }
    @media (max-width: 640px) {
      .page { padding-right: 6vw; padding-left: 6vw; }
      .topline { min-height: 58px; }
      .hero { padding-top: 62px; padding-bottom: 50px; }
      .grid { grid-template-columns: 1fr; row-gap: 38px; padding-top: 12px; }
      .image-wrap, .item:nth-child(3n) .image-wrap { aspect-ratio: 1.16 / 1; }
      .item:nth-child(even) .image-wrap { aspect-ratio: 1.36 / 1; }
      footer { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topline">
      <span class="brand">アーカイブサイト</span>
      <span>PERSONAL ARCHIVE</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Collected materials</p>
        <h1 id="page-title">アーカイブサイト</h1>
      </section>
      <section aria-label="写真の一覧">
        <div class="collection-head">
          <strong>写真</strong>
          <span id="item-count"></span>
        </div>
        <div class="grid" id="archive-grid"></div>
      </section>
    </main>
    <footer>
      <span>アーカイブサイト</span>
      <span>END OF COLLECTION</span>
    </footer>
  </div>
  <script>
    const materials = [
      {
        file: "01.jpg",
        name: "駅の券売機の画面",
        tags: [
          { label: "いつ", value: "2020年代" },
          { label: "どこで", value: "〇〇駅の改札前" }
        ]
      },
      { file: "02.jpg", name: "（ここに言葉）", tags: [] },
      { file: "03.jpg", name: "（ここに言葉）", tags: [] },
      { file: "04.jpg", name: "（ここに言葉）", tags: [] },
      { file: "05.jpg", name: "（ここに言葉）", tags: [] }
    ];
    const grid = document.querySelector("#archive-grid");
    document.querySelector("#item-count").textContent = `${String(materials.length).padStart(2, "0")} ITEMS`;

    grid.innerHTML = materials.map((material, index) => `
      <article class="item">
        <div class="image-wrap">
          <img src="images/${material.file}" alt="${material.name}" loading="lazy">
        </div>
        <div class="caption">
          <h2 class="name">${material.name}</h2>
          <span class="number">${String(index + 1).padStart(2, "0")}</span>
        </div>
        ${material.tags.length ? `<div class="tags" aria-label="タグ">${material.tags.map(tag => `<span class="tag"><span class="tag-label">${tag.label}</span>${tag.value}</span>`).join("")}</div>` : ""}
      </article>
    `).join("");
  </script>
</body>
</html>
